name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 运行单元测试
        # 五个套件都要跑：core / queue / extensions 覆盖数据层契约，
        # v3-compat 覆盖 3.0 的导航映射、判分口径唯一与错题离开规则，
        # icons 覆盖 §4.5 图标零外边距表的双向差集。少跑任何一个都会有一半契约失守。
        run: npm test

      # config.js 是版本号唯一来源，但 SW 是独立 worker 读不到 window、
      # index.html 的 meta 是静态 HTML，只能各处再写一遍。这个手工同步清单
      # 已在文档里写明过，仍多次出现漏改，故改为机器校验。
      - name: 检查版本号三处一致
        run: |
          set -e
          V_CONFIG=$(node -e "const fs=require('fs'),vm=require('vm');const c={};vm.runInNewContext(fs.readFileSync('config.js','utf8'),{window:c});process.stdout.write(c.EXAM_CONFIG.APP_VERSION)")
          V_HTML=$(grep -o 'name="version" content="[^"]*"' index.html | sed 's/.*content="//;s/".*//')
          V_SW=$(grep -o '^const VERSION = "[^"]*"' service-worker.js | sed 's/.*= "//;s/".*//')
          echo "config.js       = $V_CONFIG"
          echo "index.html meta = $V_HTML"
          echo "service-worker  = $V_SW"
          if [ "$V_CONFIG" != "$V_HTML" ] || [ "$V_CONFIG" != "$V_SW" ]; then
            echo ""
            echo "✗ 版本号三处不一致，升级时必须同步 config.js / index.html / service-worker.js"
            exit 1
          fi
          echo "  ok  三处一致：$V_CONFIG"

      - name: 检查预缓存清单覆盖页面资源
        run: |
          set -e
          node -e "
          const fs=require('fs');
          const sw=fs.readFileSync('service-worker.js','utf8');
          const pre=new Set([...sw.matchAll(/\"\.\/([^\"]+)\"/g)].map(m=>m[1]));
          const html=fs.readFileSync('index.html','utf8');
          const used=new Set();
          for(const m of html.matchAll(/<script[^>]+src=\"([^\"]+)\"/g)) used.add(m[1].replace(/^\.\//,''));
          for(const m of html.matchAll(/<link[^>]+href=\"([^\"]+)\"/g)) used.add(m[1].replace(/^\.\//,''));
          used.add('manifest.json');
          const missing=[...used].filter(u=>!pre.has(u)&&fs.existsSync(u));
          const ghost=[...pre].filter(p=>p&&!fs.existsSync(p));
          if(missing.length){console.error('✗ 未预缓存（离线时取不到）:',missing.join(', '));process.exit(1);}
          if(ghost.length){console.error('✗ 清单指向不存在的文件（会让 SW install 整体失败）:',ghost.join(', '));process.exit(1);}
          console.log('  ok  '+used.size+' 个页面资源全部在预缓存清单内');
          "

      - name: 检查 JS 语法
        run: |
          set -e
          for f in config.js js/*.js test/*.js; do
            node --check "$f" && echo "  ok  $f"
          done

      # 见 docs/ARCHITECTURE.md「五、模板书写约定」
      # 模板属性值内出现 > 或 => 时，会被某些 HTML 处理工具注入属性而破坏 Vue 表达式，
      # 且生产版 Vue 会吞掉编译错误，直接白屏。这里把约定变成机器可校验的规则。
      - name: 检查 Vue 模板表达式安全
        run: |
          set -e
          if grep -nE '(v-[a-z-]+|@[a-zA-Z.-]+|:[a-zA-Z.-]+)="[^"]*(=>|>)"' index.html; then
            echo ""
            echo "✗ 模板属性值内不允许出现 > 或 =>，请抽成 computed 或 method。"
            echo "  详见 docs/ARCHITECTURE.md"
            exit 1
          fi
          echo "  ok  index.html 模板表达式安全"

      - name: 检查关键文件完整
        run: |
          set -e
          for f in index.html config.js default-bank.js \
                   css/tokens.css css/components.css css/pages.css \
                   css/responsive.css css/themes.css css/accessibility.css \
                   js/core.js js/store.js js/leitner.js js/wrongbook.js \
                   js/ai-prompt.js js/app.js vendor/vue.global.prod.js; do
            test -f "$f" && echo "  ok  $f" || { echo "✗ 缺失 $f"; exit 1; }
          done

      - name: 检查文档链接可达
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          root = pathlib.Path('.')
          files = [root / 'README.md'] + sorted(root.glob('docs/*.md'))
          broken, checked = [], 0

          for f in files:
              for target in re.findall(r'\]\((\.\.?/[^)#]+)\)', f.read_text(encoding='utf-8')):
                  # 相对链接按「所在文件目录」解析，锚点忽略
                  p = ((f.parent / target.split('#')[0]).resolve())
                  checked += 1
                  if p.exists():
                      print(f'  ok  {f.name} -> {target}')
                  else:
                      print(f'  XX  {f.name} -> {target}')
                      broken.append(str(p))

          print(f'\n共检查 {checked} 条相对链接')
          if broken:
              sys.exit('✗ 存在断链：\n' + '\n'.join(broken))
          print('✓ 全部可达')
          PY

      # var(--x) 引用了没定义的变量时，整条声明「computed-value 阶段失效」，
      # 表现是背景变透明 / 颜色回落继承值，且不报任何错——只能靠机器查。
      # （--surface-sub 曾被 14 处引用却全站没定义，就是这么潜伏着的）
      - name: 检查 CSS 变量都有定义
        run: |
          set -e
          node -e "
          const fs=require('fs');
          const files=fs.readdirSync('css').map(f=>'css/'+f);
          const strip=s=>s.replace(/\/\*[\s\S]*?\*\//g,'');
          const defined=new Set();
          for(const f of files)
            for(const m of strip(fs.readFileSync(f,'utf8')).matchAll(/(--[\w-]+)\s*:/g)) defined.add(m[1]);
          const bad=new Map();
          for(const f of files)
            for(const m of strip(fs.readFileSync(f,'utf8')).matchAll(/var\(\s*(--[\w-]+)(\s*,[^)]*)?\)/g))
              if(!defined.has(m[1])&&!m[2]) bad.set(m[1],(bad.get(m[1])||0)+1);
          if(bad.size){
            console.error('✗ 引用了未定义且无 fallback 的 CSS 变量（这些声明全部失效）：');
            for(const [v,n] of bad) console.error('   '+v+'  共 '+n+' 处');
            process.exit(1);
          }
          console.log('  ok  '+defined.size+' 个自定义属性，全部 var() 引用有定义（或带 fallback）');
          "

      # 白字压亮语义色只有 2.0–3.6:1，达不到 WCAG AA 正文的 4.5:1。
      # 规矩：承载文字的填充面必须用 --success-fill / --danger-fill，
      # 前景必须用 --on-accent（深色模式下它是近黑）。这里把两条不变量钉住。
      - name: 检查对比度不变量
        run: |
          set -e
          node -e "
          const fs=require('fs');
          // 不承载文字的纯装饰条，允许直接用亮语义色
          const BARS=['.progress-bar','.md-home-today-bar .bar-fill','.md-home-trend-bar .bar-mastered'];
          const files=fs.readdirSync('css').map(f=>'css/'+f);
          const strip=s=>s.replace(/\/\*[\s\S]*?\*\//g,'');
          const viol=[];
          for(const f of files)
            for(const m of strip(fs.readFileSync(f,'utf8')).matchAll(/([^{}]+)\{([^}]*)\}/g)){
              const sel=m[1].trim().replace(/\s+/g,' ').replace(/,\s*\$/,'');
              if(sel.startsWith('@')) continue;
              const body=m[2];
              if(/(^|;)\s*color\s*:\s*(#fff|#ffffff|white)\s*(;|\$)/i.test(body))
                viol.push(f+'  ['+sel+']  硬编码白色前景，应改用 var(--on-accent)');
              if(/(^|;)\s*background(-color)?\s*:\s*var\(--(success|danger)\)\s*(;|\$)/.test(body)
                 && !BARS.some(b=>sel===b||sel.split(',').map(x=>x.trim()).includes(b)))
                viol.push(f+'  ['+sel+']  亮语义色做填充底，配白字不达 AA（应改 --success-fill / --danger-fill，或加进 BARS 白名单）');
            }
          if(viol.length){
            console.error('✗ 对比度不变量被破坏：');
            for(const v of new Set(viol)) console.error('   '+v);
            process.exit(1);
          }
          console.log('  ok  对比度不变量：无硬编码白色前景，亮语义色只用于纯装饰条');
          "
