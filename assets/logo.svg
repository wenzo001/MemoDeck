<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MemoDeck">
  <!-- MemoDeck 3.0 应用图标（暖纸墨色 + 琥珀强调，DESIGN.md §1/§2）
       无渐变、无阴影：§7.1 禁止渐变与玻璃拟态，底色用实色。
       内容全部落在中心 46% 半径内 —— manifest 里 icons 声明了 purpose: maskable，
       被系统按圆形裁剪时不会切到字形。
       改动后重新栅格化：node tools/make-icons.mjs（见该脚本顶部注释） -->
  <rect width="512" height="512" rx="116" fill="#211A15"/>
  <!-- 后面一张卡（琥珀）露出的边，读作「一叠卡」 -->
  <rect x="176" y="148" width="196" height="132" rx="20" fill="#B45309"/>
  <!-- 前面的纸卡 -->
  <rect x="140" y="184" width="232" height="180" rx="24" fill="#F5F1EB"/>
  <rect x="172" y="226" width="112" height="15" rx="7.5" fill="#CBBFAE"/>
  <rect x="172" y="256" width="76" height="15" rx="7.5" fill="#CBBFAE"/>
  <!-- 记住的那一笔 -->
  <path d="M276 288 L300 312 L344 260" fill="none" stroke="#B45309" stroke-width="24"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
